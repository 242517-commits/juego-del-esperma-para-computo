</style></head><body><div id="app">
<div id="hud"><div class="h">Zona anatómica<b id="z">-</b></div><div class="h">Energía vital<div id="eb"><div id="ef"></div></div></div><div class="h">Posición<b id="p">1º</b></div><div class="h">Correctas<b id="q">0/4</b></div></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=800,H=450,$=id=>document.getElementById(id),D=[[0,-1],[1,0],[0,1],[-1,0]];
const LV=[
{n:'El Canal Vaginal',bg:['#3b0a66','#16042e'],wc:'#c47bff',cs:56,hint:'🧪 Esquiva el pH ácido: te quema la energía. ⭐ lo limpia.'},
{n:'El Cuello Uterino (Cérvix)',bg:['#ff9ec7','#e0529a'],wc:'#8a1658',cs:56,hint:'💧 El moco denso reduce tu velocidad a la mitad. ¡Recoge una ⭐ para limpiarlo!'},
{n:'La Cavidad Uterina',bg:['#ff9580','#d9483a'],wc:'#7d1d17',cs:56,hint:'👾 Los macrófagos te persiguen para destruirte. ¡No te dejes alcanzar!'},
{n:'El Istmo de la Trompa',bg:['#9a3dff','#4b0fb8'],wc:'#f2d2ff',cs:40,hint:'🌊 Laberinto estrecho y cilios que te empujan hacia atrás.'},
{n:'La Ampolla Tubárica',bg:['#ff2bb0','#a8007a'],wc:null,cs:0,hint:'🟡 ¡Pista libre a máxima velocidad! Toca el Ovocito antes que nadie.'}];
const QB=[
[["¿Cuál es el pH vaginal normal en la edad reproductiva?",["3,8 – 4,5","5,5 – 6,0","7,0 – 7,4","8,0 – 8,5"],0,"Los lactobacilos transforman el glucógeno en ácido láctico y mantienen el pH ácido."],
["¿Qué componente del semen neutraliza transitoriamente la acidez vaginal?",["Fructosa","Plasma seminal alcalino","Testosterona","Hialuronidasa"],1,"Las secreciones de vesículas seminales y próstata elevan el pH local."],
["¿Qué microorganismo predomina en la flora vaginal sana?",["Lactobacillus","Candida albicans","Gardnerella vaginalis","Escherichia coli"],0,"Los Lactobacillus protegen frente a patógenos al acidificar el medio."]],
[["¿Qué hormona vuelve el moco cervical abundante, filante y permeable cerca de la ovulación?",["Progesterona","Estrógeno","Prolactina","hCG"],1,"El pico de estrógeno genera moco filante; la progesterona lo espesa y lo hace impenetrable."],
["¿Dónde se almacenan temporalmente los espermatozoides en el cérvix?",["Glándulas de Bartolino","Criptas endocervicales","Glándulas de Skene","Fondo de saco posterior"],1,"Las criptas funcionan como reservorio y liberan espermatozoides durante horas."],
["La capacitación espermática consiste en…",["Maduración en el testículo","Cambios funcionales en el tracto genital femenino que habilitan la fecundación","Producción de testosterona","Formación del acrosoma"],1,"Ocurre tras la eyaculación y permite la reacción acrosómica y la hiperactivación."]],
[["¿Qué hormona domina la fase secretora (lútea) del endometrio?",["FSH","Progesterona","Oxitocina","Estrógeno"],1,"El cuerpo lúteo secreta progesterona, que transforma el endometrio en secretor."],
["De millones de espermatozoides depositados, ¿cuántos llegan a la ampolla?",["Millones","Decenas de millones","Unos cientos","Todos"],2,"Solo unos cientos sobreviven al trayecto: es una selección natural."],
["¿Qué células inmunes del útero pueden fagocitar espermatozoides?",["Macrófagos y neutrófilos","Eritrocitos","Plaquetas","Adipocitos"],0,"Tras el coito hay una reacción leucocitaria en el tracto genital femenino."]],
[["¿Dónde ocurre habitualmente la fecundación?",["Istmo","Ampolla de la trompa uterina","Cavidad uterina","Cérvix"],1,"La ampolla es el tercio externo y más ancho de la trompa."],
["La hiperactivación espermática depende sobre todo de…",["Entrada de calcio por canales CatSper","Pérdida de agua","Descenso de progesterona","Aumento del pH vaginal"],0,"El calcio produce un batido flagelar vigoroso y asimétrico que permite avanzar y penetrar."],
["¿Cuánto tiempo es fecundable el ovocito tras la ovulación?",["12 – 24 horas","3 – 5 días","7 días","48 – 72 horas"],0,"El espermatozoide sobrevive hasta ~5 días, por eso la ventana fértil es más larga que la vida del ovocito."]]];
const BASE=[135,135,135,150,230],NAMES=['Azul','Verde','Amarillo'],COLS=['#4aa8ff','#3ddc84','#ffd23f'];
let S='menu',lv=0,P,R=[],RC=[],g=[],cols,rows,ox,oy,cs,gr,dist,pd,pdT=0,items=[],foes=[],bake,WW=W,cam=0,en=100,ok=0,pop=[],keys={},ptr=null,T=0,boost=0,mucus=0,acid=0,inv=0,introT=0,gq,gT,crossT,fast=0,CF=[],cfOn=0,last=0;
const BUB=Array.from({length:22},()=>({x:Math.random()*W,y:Math.random()*H,r:4+Math.random()*16,z:.2+Math.random()*.5,v:Math.random()*2}));
function ov(h,q){const o=$('ov');o.innerHTML=h;o.className='ov'+(q?' q':'')}
function hov(){$('ov').className='ov hide'}
function bfs(sx,sy){const d=new Array(cols*rows).fill(-1);d[sy*cols+sx]=0;const q=[[sx,sy]];for(let h=0;h<q.length;h++){const[x,y]=q[h],c=g[y*cols+x];for(let i=0;i<4;i++)if(!c.w[i]){const nx=x+D[i][0],ny=y+D[i][1],k=ny*cols+nx;if(d[k]<0){d[k]=d[y*cols+x]+1;q.push([nx,ny])}}}return d}
function cellOf(x,y){return[Math.max(0,Math.min(cols-1,Math.floor((x-ox)/cs))),Math.max(0,Math.min(rows-1,Math.floor((y-oy)/cs)))]}
function cc(x,y){return{x:ox+(x+.5)*cs,y:oy+(y+.5)*cs}}
function maze(L){cs=L.cs;cols=Math.floor(W/cs);rows=Math.floor(H/cs);ox=(W-cols*cs)/2;oy=(H-rows*cs)/2;gr=rows>>1;g=[];
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)g.push({x,y,w:[1,1,1,1],v:0});
const at=(x,y)=>x<0||y<0||x>=cols||y>=rows?null:g[y*cols+x],st=[at(0,gr)];st[0].v=1;
while(st.length){const c=st[st.length-1],n=[];D.forEach((d,i)=>{const q=at(c.x+d[0],c.y+d[1]);if(q&&!q.v)n.push([i,q])});if(!n.length){st.pop();continue}const[i,q]=n[Math.random()*n.length|0];c.w[i]=0;q.w[(i+2)%4]=0;q.v=1;st.push(q)}
for(let k=0;k<cols*rows*.12;k++){const c=g[Math.random()*g.length|0],i=Math.random()*4|0,q=at(c.x+D[i][0],c.y+D[i][1]);if(q){c.w[i]=0;q.w[(i+2)%4]=0}}
dist=bfs(cols-1,gr);const t=cs>45?7:5;bake=document.createElement('canvas');bake.width=W;bake.height=H;const b=bake.getContext('2d');
b.strokeStyle=L.wc;b.lineWidth=t;b.lineCap='round';b.shadowColor=L.wc;b.shadowBlur=10;b.beginPath();RC=[];
const seg=(x1,y1,x2,y2,skip)=>{RC.push({x:Math.min(x1,x2)-t/2,y:Math.min(y1,y2)-t/2,w:Math.abs(x2-x1)+t,h:Math.abs(y2-y1)+t});if(!skip){b.moveTo(x1,y1);b.lineTo(x2,y2)}};
for(const c of g){const x0=ox+c.x*cs,y0=oy+c.y*cs;if(c.w[0]&&c.y==0)seg(x0,y0,x0+cs,y0);if(c.w[1])seg(x0+cs,y0,x0+cs,y0+cs,c.x==cols-1&&c.y==gr);if(c.w[2])seg(x0,y0+cs,x0+cs,y0+cs);if(c.w[3]&&c.x==0)seg(x0,y0,x0,y0+cs)}
b.stroke()}
function spots(n){return g.filter(c=>c.x>1&&!(c.x==cols-1&&c.y==gr)).sort(()=>Math.random()-.5).slice(0,n).map(c=>cc(c.x,c.y))}
function load(i,leads){lv=i;const L=LV[i];items=[];foes=[];pop=[];cam=0;mucus=i==1?1:0;acid=0;inv=0;WW=i==4?2700:W;R=[];
if(i<4){maze(L);const s=cc(0,gr);P={x:s.x,y:s.y,a:0,ta:0,r:i==3?7:10};
if(i==0){spots(9).forEach(p=>items.push({t:'🧪',...p}))}
if(i==1){spots(8).forEach(p=>items.push({t:'💧',...p}))}
spots(i==3?4:3).forEach(p=>items.push({t:'⭐',...p}));
if(i==2){spots(3).forEach(p=>foes.push({x:p.x,y:p.y}));pd=bfs(0,gr)}}
else{RC=[];bake=null;P={x:40,y:H*.5,a:0,ta:0,r:10}}
for(let k=0;k<3;k++){let pts;
if(i<4){pts=[];let [x,y]=[0,gr];pts.push(cc(x,y));while(dist[y*cols+x]>0){const c=g[y*cols+x];let bx=x,by=y,bd=1e9;for(let j=0;j<4;j++)if(!c.w[j]){const nx=x+D[j][0],ny=y+D[j][1];if(dist[ny*cols+nx]<bd){bd=dist[ny*cols+nx];bx=nx;by=ny}}x=bx;y=by;pts.push(cc(x,y))}pts.push({x:ox+cols*cs-cs*.35,y:oy+(gr+.5)*cs})}
else{const ly=[90,170,360][k];pts=[{x:40,y:ly},{x:WW-125,y:ly}]}
const cum=[0];for(let j=1;j<pts.length;j++)cum.push(cum[j-1]+Math.hypot(pts[j].x-pts[j-1].x,pts[j].y-pts[j-1].y));
const sp=[105+Math.random()*20,100+Math.random()*20,108+Math.random()*18,[96,100][k%2]+Math.random()*10,205+Math.random()*28][i]*(i<3?1:1);
R.push({k,nm:NAMES[k],col:COLS[k],pts,cum,len:cum[cum.length-1],sp,s:leads?Math.max(-10,leads[k])*sp:0,st:'run',arr:0,ans:0,ct:0})}}
function pAt(r,s){const c=r.cum,p=r.pts;if(s<=0)return p[0];if(s>=r.len)return p[p.length-1];let i=1;while(c[i]<s)i++;const t=(s-c[i-1])/(c[i]-c[i-1]);return{x:p[i-1].x+(p[i].x-p[i-1].x)*t,y:p[i-1].y+(p[i].y-p[i-1].y)*t}}
function rpos(r){const p=pAt(r,r.s);let x=p.x,y=p.y;if(r.s<=0)y+=(r.k-1)*12;if(lv==4)y+=Math.sin(r.s/70+r.k*2)*30;if(r.st!='run')y+=(r.k-1)*13;return{x,y}}
function startGame(){en=100;ok=0;boost=0;T=0;cfOn=0;$('cf').getContext('2d').clearRect(0,0,W,H);load(0);intro('¡Corre contra 3 rivales! Responde rápido en cada compuerta.')}
function intro(m){S='intro';introT=3;ov(`<p class=sm>Nivel ${lv+1} de 5</p><h1>${LV[lv].n}</h1><p>${LV[lv].hint}</p><p>${m||''}</p><div id=cd class=big>3</div>`)}
function menu(){ov(`<h1>☄️ Carrera del Espermatozoide</h1><h2>Obstetricia: 5 zonas anatómicas</h2><p>Corre por el tracto reproductor femenino contra los espermatozoides <b style="color:#4aa8ff">azul</b>, <b style="color:#3ddc84">verde</b> y <b style="color:#ffd23f">amarillo</b>. En cada compuerta responde una pregunta clínica: si fallas o tardas, te adelantan. Si aciertas en menos de 5 s, ganas un Súper Impulso ⚡.</p><p class=sm>Mueve con flechas o WASD. En móvil, mantén el dedo sobre la pantalla. Responde con clic o teclas 1-4.</p><button class=b onclick="startGame()">¡Jugar!</button>`)}
function openGate(){S='gate';const q=QB[lv][Math.random()*3|0],ix=[0,1,2,3].sort(()=>Math.random()-.5);gq={o:ix.map(i=>q[1][i]),c:ix.indexOf(q[2]),e:q[3],done:0};gT=T;
ov(`<div class=card><div class=tag>🧬 Compuerta de Selección Natural</div><div class=bar><i id=tb></i></div><h2>${q[0]}</h2><div class=opts>${gq.o.map((t,i)=>`<button class=o onclick="ans(${i})">${i+1}. ${t}</button>`).join('')}</div><div id=ex></div><div id=rs></div></div>`,1)}
function ans(i){if(S!=='gate'||gq.done)return;gq.done=1;const el=T-gT,good=i===gq.c&&el<=10;fast=good&&el<=5;
document.querySelectorAll('.o').forEach((b,j)=>{b.disabled=1;if(j===gq.c)b.classList.add('ok');else if(j===i)b.classList.add('no')});
if(good){ok++;en=Math.min(100,en+25);crossT=T+.9}else{en-=15;crossT=T+4}
$('ex').innerHTML=(good?(fast?'⚡ ¡Súper Impulso! ':'✅ ¡Correcto! '):(i<0?'⏰ Tiempo agotado. ':'❌ Incorrecto. '))+gq.e+(good?'':' Los rivales te sacan ventaja…');if(en<=0)end(false,'Te quedaste sin energía.')}
function next(){const cr=R.filter(r=>r.st==='cross').length+1,leads=R.map(r=>r.st==='cross'?Math.min(8,crossT-r.ct):r.st==='wait'?-(Math.max(0,r.ans-crossT)+1.5):-((r.len-r.s)/r.sp+3));
load(lv+1,leads);boost=fast?7:0;intro(`Cruzaste la compuerta en ${cr}º lugar${fast?' con ⚡ Súper Impulso':''}.`)}
function end(win,why){if(S==='end')return;S='end';const rr=R.map(r=>({r,rem:r.st!=='run'?-1:r.len-r.s})).sort((a,b)=>a.rem-b.rem).map(x=>x.r);
if(win){const pl=(n,h,c,l)=>`<div class=pl style="height:${h}px;background:${c}"><div class=dot style="background:${l};color:${l}"></div>${n}</div>`;
ov(`<h1>🏆 ¡Líder de la Fecundación!</h1><h2>Obstetra Experto</h2><div class=pod>${pl(rr[0].nm+' 2º',100,'#7a7a9a',rr[0].col)}${pl('¡Tú! 1º',140,'#d9a400','#fff')}${pl(rr[1].nm+' 3º',70,'#a0613a',rr[1].col)}</div><p class=sm>4º: ${rr[2].nm}. Preguntas correctas: ${ok}/4.</p><button class=b onclick="startGame()">Jugar otra vez</button>`);cfOn=1;CF=[];for(let i=0;i<160;i++)confetti(1)}
else ov(`<h1>🧫 Fecundación por un Rival</h1><h2>Inténtalo de nuevo</h2><p>${why}</p><p class=sm>Llegaste a la zona ${lv+1} de 5 con ${ok} preguntas correctas.</p><button class=b onclick="startGame()">Reintentar</button>`)}
function confetti(b){CF.push({x:b?W/2:Math.random()*W,y:b?H*.4:-10,vx:(Math.random()-.5)*(b?14:3),vy:b?-Math.random()*13-2:2,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*6,r:Math.random()*6})}
function push(){for(const q of RC){const cx=Math.max(q.x,Math.min(P.x,q.x+q.w)),cy=Math.max(q.y,Math.min(P.y,q.y+q.h)),ex=P.x-cx,ey=P.y-cy,d=Math.hypot(ex,ey);if(d<P.r&&d>.001){P.x+=ex/d*(P.r-d);P.y+=ey/d*(P.r-d)}}}
function move(dx,dy){P.x+=dx;push();P.y+=dy;push();push();P.x=Math.max(P.r+3,Math.min(WW-P.r-3,P.x));P.y=Math.max(P.r+3,Math.min(H-P.r-3,P.y))}
function say(t,x,y,c){pop.push({t,x:x-cam,y,l:1.4,c:c||'#fff'})}
function rank(){if(S==='gate')return 1+R.filter(r=>r.st==='cross').length;let rp;if(lv==4)rp=Math.max(0,WW-125-P.x);else{const[a,b]=cellOf(P.x,P.y);rp=dist[b*cols+a]*cs}return 1+R.filter(r=>r.st!=='run'||r.len-r.s<rp).length}
function ur(r,dt){if(r.st==='run'){r.s+=r.sp*(1+.1*Math.sin(T*1.7+r.k*2))*dt;if(r.s>=r.len){r.s=r.len;if(lv==4)end(false,`El espermatozoide ${r.nm} llegó primero al ovocito.`);else{r.st='wait';r.arr=T;r.ans=T+5+Math.random()*4}}}else if(r.st==='wait'&&T>=r.ans){r.st='cross';r.ct=T}}
function upd(dt){T+=dt;
if(S==='intro'){introT-=dt;const e=$('cd');if(e)e.textContent=introT>.3?Math.ceil(introT):'¡YA!';if(introT<=0){S='play';hov()}return}
if(S!=='play'&&S!=='gate')return;
R.forEach(r=>ur(r,dt));if(S==='end')return;
if(S==='gate'){const el=T-gT;if(!gq.done){$('tb').style.width=Math.max(0,100-el*10)+'%';if(el>10)ans(-1)}else if(T>=crossT&&S==='gate')next();const e=$('rs');if(e)e.innerHTML=R.map(r=>`<span style="color:${r.col}">● ${r.nm}: ${r.st=='cross'?'cruzó ✔':r.st=='wait'?'respondiendo…':'en camino'}</span>`).join('');return}
let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
if(ptr&&!dx&&!dy){const vx=ptr.x-(P.x-cam),vy=ptr.y-P.y,d=Math.hypot(vx,vy);if(d>10){dx=vx/d;dy=vy/d}}
const m=Math.hypot(dx,dy);if(m){dx/=m;dy/=m;P.ta=Math.atan2(dy,dx)}
const sp=BASE[lv]*(mucus?.5:1)*(boost>0?1.5:1)*(acid>0?.85:1);move(dx*sp*dt-(lv==3?40*dt:0),dy*sp*dt);
